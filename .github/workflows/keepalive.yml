name: Keepalive

on:
  schedule:
    - cron: "0 12 * * 1"  # 매주 월요일 21:00 KST
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: daily.yml 재활성화
        run: gh workflow enable daily.yml --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
